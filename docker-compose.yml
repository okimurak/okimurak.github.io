services:
  web:
    image: hugomods/hugo:std-dart-sass-go-0.149.1
    container_name: hugo
    ports:
      - "1313:1313"
    volumes:
      - ./:/usr/local/okimurak/okimurak-github-io
    working_dir: /usr/local/okimurak/okimurak-github-io
    command: server --bind 0.0.0.0 -D --disableFastRender
